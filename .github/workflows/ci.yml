name: Node.js CI

   
on:  
   push:
      branches: [ main ]
   pull_request:
      branches: [ main ]

jobs:
   build:

      runs-on: ubuntu-latest

      defaults:
         run:
            working-directory: backend

      steps:
          - uses: actions/checkout@v6
          - name: Use Node.js
            uses: actions/setup-node@v7
            with:
               node-version: '24.x'
          - run: npm ci
          - run: npm test
            